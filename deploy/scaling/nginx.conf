events {}

http {
    upstream lottery_backend {
        server app1:8080;
        server app2:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://lottery_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # surfaces which instance served the request, so you can see the
            # round-robin load balancing in action
            add_header X-Upstream $upstream_addr;
        }
    }
}
