server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: lottery-platform
  # DataSource / connection pool are fully driven by env vars so we can swap
  # environments (local / docker / staging / prod) without rebuilding the image.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lottery?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:lottery}
    password: ${DB_PASSWORD:lottery}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONN_TIMEOUT_MS:30000}
      pool-name: lottery-hikari
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

app:
  jwt:
    # NOTE: dev-only default. MUST be overridden via JWT_SECRET in real envs.
    secret: ${JWT_SECRET:dev-only-secret-please-override-with-a-long-random-value-32b+}
    expiration-minutes: ${JWT_EXP_MINUTES:120}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.amway.ecommerce.lottery: ${APP_LOG_LEVEL:INFO}
