<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>抽獎後台設定</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
               margin: 0; background: #f4f5f7; color: #222; }
        header { background: #333; color: #fff; padding: 14px 20px; font-weight: 600;
                 display: flex; justify-content: space-between; align-items: center; }
        .header-link { color: #ffd; font-size: 13px; font-weight: normal; border: 1px solid rgba(255,255,200,.4);
                       border-radius: 5px; padding: 4px 10px; text-decoration: none; }
        .header-link:hover { background: rgba(255,255,255,.1); }
        .wrap { max-width: 900px; margin: 0 auto; padding: 20px; }
        .card { background: #fff; border-radius: 10px; padding: 18px; margin-bottom: 18px;
                box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        h3 { margin: 0 0 12px; }
        label { font-size: 13px; color: #555; margin-right: 4px; }
        input, select { padding: 7px; border: 1px solid #ccc; border-radius: 6px; margin: 3px 8px 3px 0; }
        input.sm { width: 90px; }
        button { background: #c8102e; color: #fff; border: none; border-radius: 6px;
                 padding: 8px 14px; cursor: pointer; font-size: 13px; }
        button.ghost { background: #fff; color: #333; border: 1px solid #999; }
        button.mini { padding: 5px 10px; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th, td { border-bottom: 1px solid #eee; padding: 6px 4px; text-align: left; font-size: 13px; }
        .muted { color: #888; font-size: 13px; }
        .rowline { padding: 8px; border: 1px solid #eee; border-radius: 6px; margin: 6px 0; cursor: pointer; }
        .rowline:hover { background: #fafafa; }
        .rowline.active { border-color: #c8102e; background: #fff7f8; }
        .sum-ok { color: #27ae60; font-weight: 600; }
        .sum-bad { color: #c8102e; font-weight: 600; }
        .flash { font-size: 13px; margin-left: 8px; }
    </style>
</head>
<body>
<header>
    <div style="display:flex; align-items:center; gap:12px">
        <span>🛠️ 抽獎後台設定（ADMIN）</span>
        <a href="/" class="header-link">← 回轉盤前台</a>
    </div>
    <div id="userInfo" style="display:none; align-items:center; gap:8px">
        <span id="usernameDisplay" style="font-size:13px; font-weight:normal; color:#ffd"></span>
        <button onclick="logout()">登出</button>
    </div>
</header>
<div class="wrap">
    <div class="card" id="loginCard">
        <h3>管理員登入</h3>
        <label>帳號</label><input id="username" value="admin"/>
        <label>密碼</label><input id="password" type="password" value="admin123"/>
        <button onclick="login()">登入</button>
        <span class="flash muted" id="loginMsg"></span>
    </div>

    <div id="console" style="display:none">
        <div class="card">
            <h3>建立新活動</h3>
            <label>代碼</label><input id="na_code" class="sm" placeholder="AUTUMN2026"/>
            <label>名稱</label><input id="na_name" placeholder="秋季抽獎"/>
            <label>每人上限</label><input id="na_peruser" class="sm" type="number" value="10"/>
            <label>活動總上限</label><input id="na_total" class="sm" type="number" placeholder="(可空)"/>
            <button onclick="createActivity()">建立</button>
            <span class="flash" id="createMsg"></span>
        </div>

        <div class="card">
            <h3>活動列表 <button class="ghost mini" onclick="loadActivities()">重新整理</button></h3>
            <div id="activityList" class="muted">載入中…</div>
        </div>

        <div class="card" id="editCard" style="display:none">
            <h3><span id="editTitle"></span> <button class="ghost mini" onclick="selectActivity(selectedId)">↻ 刷新</button></h3>
            <div>
                <label>名稱</label><input id="ea_name"/>
                <label>狀態</label>
                <select id="ea_status">
                    <option>DRAFT</option><option>ACTIVE</option><option>ENDED</option>
                </select>
                <label>每人上限</label><input id="ea_peruser" class="sm" type="number"/>
                <label>總上限</label><input id="ea_total" class="sm" type="number" placeholder="(可空)"/>
                <button onclick="saveActivity()">儲存活動</button>
                <span class="flash" id="editMsg"></span>
            </div>
            <p class="muted" style="margin:8px 0 0">提示：機率以百分比（%）輸入，最小 0.01%。銘謝惠顧機率由系統自動填補剩餘，總和永遠為 100%。</p>

            <h3 style="margin-top:18px">獎品設定 <span id="sumInfo" class="flash"></span></h3>
            <div id="probWarn" style="display:none; color:#c8102e; font-size:13px; margin:4px 0 8px; font-weight:600;"></div>
            <table>
                <thead><tr><th>ID</th><th>名稱</th><th>類型</th><th>機率(%)</th><th>總庫存</th><th>剩餘</th><th></th></tr></thead>
                <tbody id="prizeRows"></tbody>
            </table>

            <div style="margin-top:10px; padding:10px 14px; background:#f0f7f0; border-radius:6px; border:1px solid #c3e6c3; font-size:13px;">
                <input type="hidden" id="thanksId"/>
                <strong>銘謝惠顧</strong>
                <span style="color:#555; margin-left:8px">機率：<strong id="thanksProb">—</strong>（自動填補剩餘）</span>
                <span style="margin-left:16px">名稱：<input id="thanksName" style="width:110px; padding:5px;"/> <button class="mini" onclick="saveThanksName()">儲存名稱</button></span>
            </div>

            <div style="margin-top:12px">
                <strong style="font-size:13px">新增獎品：</strong>
                <input id="np_name" placeholder="名稱"/>
                <select id="np_type"><option>PRIZE</option></select>
                <input id="np_prob" class="sm" type="number" placeholder="機率(%)" step="0.01" min="0.01" max="100"/>
                <input id="np_stock" class="sm" type="number" placeholder="庫存"/>
                <button class="mini" onclick="addPrize()">新增</button>
                <span class="flash" id="addPrizeMsg"></span>
            </div>

            <h3 style="margin-top:18px">統計</h3>
            <div id="statsBox" class="muted"></div>
        </div>
    </div>
</div>

<script>
    let token = null;
    let selectedId = null;

    async function api(path, options = {}) {
        options.headers = Object.assign({ "Content-Type": "application/json" }, options.headers || {});
        if (token) options.headers["Authorization"] = "Bearer " + token;
        const res = await fetch(path, options);
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
            if (res.status === 401 && path !== "/api/auth/login") autoLogout();
            throw new Error(body.message || ("HTTP " + res.status));
        }
        return body.data;
    }

    function flash(id, msg, ok = true) {
        const el = document.getElementById(id);
        el.textContent = msg;
        el.className = "flash " + (ok ? "sum-ok" : "sum-bad");
    }

    async function login() {
        try {
            const username = document.getElementById("username").value;
            const data = await api("/api/auth/login", { method: "POST",
                body: JSON.stringify({ username,
                                       password: document.getElementById("password").value }) });
            if (data.role !== "ADMIN") {
                flash("loginMsg", "權限不足，此帳號無法進入後台", false);
                return;
            }
            token = data.accessToken;
            localStorage.setItem("lotteryToken", token);
            localStorage.setItem("lotteryUser", username);
            showConsole(username);
            await loadActivities();
        } catch (e) {
            flash("loginMsg", "登入失敗：" + e.message, false);
        }
    }

    function showConsole(username) {
        document.getElementById("loginCard").style.display = "none";
        document.getElementById("usernameDisplay").textContent = username;
        document.getElementById("userInfo").style.display = "flex";
        document.getElementById("console").style.display = "block";
    }

    async function loadActivities() {
        const list = await api("/api/admin/activities");
        const box = document.getElementById("activityList");
        box.innerHTML = "";
        list.forEach(a => {
            const div = document.createElement("div");
            div.className = "rowline" + (a.id === selectedId ? " active" : "");
            div.textContent = `#${a.id} [${a.status}] ${a.code} - ${a.name}（每人 ${a.perUserDrawLimit} 次）`;
            div.onclick = () => selectActivity(a.id);
            box.appendChild(div);
        });
        if (!list.length) box.textContent = "尚無活動";
    }

    async function createActivity() {
        try {
            const totalRaw = document.getElementById("na_total").value;
            await api("/api/admin/activities", { method: "POST", body: JSON.stringify({
                code: document.getElementById("na_code").value,
                name: document.getElementById("na_name").value,
                perUserDrawLimit: Number(document.getElementById("na_peruser").value),
                totalDrawLimit: totalRaw ? Number(totalRaw) : null
            }) });
            flash("createMsg", "已建立", true);
            await loadActivities();
        } catch (e) {
            flash("createMsg", e.message, false);
        }
    }

    async function selectActivity(id) {
        selectedId = id;
        await loadActivities();
        const detail = await api("/api/activities/" + id);
        document.getElementById("editCard").style.display = "block";
        document.getElementById("editTitle").textContent = `編輯活動 #${id}：${detail.name}`;
        document.getElementById("ea_name").value = detail.name;
        document.getElementById("ea_status").value = detail.status;
        document.getElementById("ea_peruser").value = detail.perUserDrawLimit;
        document.getElementById("ea_total").value = detail.totalDrawLimit ?? "";
        renderPrizes(detail.prizes);
        loadStats(id);
    }

    async function saveActivity() {
        try {
            const totalRaw = document.getElementById("ea_total").value;
            await api("/api/admin/activities/" + selectedId, { method: "PUT", body: JSON.stringify({
                name: document.getElementById("ea_name").value,
                status: document.getElementById("ea_status").value,
                perUserDrawLimit: Number(document.getElementById("ea_peruser").value),
                totalDrawLimit: totalRaw ? Number(totalRaw) : null
            }) });
            flash("editMsg", "已儲存", true);
            await loadActivities();
        } catch (e) {
            flash("editMsg", e.message, false);
        }
    }

    function warnIfProbTooLow(val) {
        const warn = document.getElementById("probWarn");
        if (Number(val) < 0.01) {
            warn.textContent = "⚠️ 機率不可低於 0.01%";
            warn.style.display = "block";
        } else {
            warn.style.display = "none";
        }
    }

    function renderPrizes(prizes) {
        const tbody = document.getElementById("prizeRows");
        tbody.innerHTML = "";
        let thanksItem = null;

        prizes.forEach(p => {
            if (p.type === "THANKS") { thanksItem = p; return; }
            const displayProb = (p.probability / 100).toFixed(2);
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${p.id}</td>
                <td><input value="${p.name}" data-f="name"/></td>
                <td>${p.type}</td>
                <td><input class="sm" type="number" value="${displayProb}" step="0.01" min="0.01" max="100" data-f="prob"/></td>
                <td><input class="sm" type="number" value="${p.totalStock}" data-f="total"/></td>
                <td><input class="sm" type="number" value="${p.remainingStock}" data-f="remain"/></td>
                <td style="white-space:nowrap">
                    <button class="mini" data-save>儲存</button>
                    <button class="mini ghost" data-del style="margin-left:4px">刪除</button>
                </td>`;
            tr.querySelector("[data-f='prob']").addEventListener("input", function() {
                warnIfProbTooLow(this.value);
            });
            tr.querySelector("[data-save]").onclick = () => savePrize(p.id, tr);
            tr.querySelector("[data-del]").onclick = () => deletePrize(p.id, p.name);
            tbody.appendChild(tr);
        });

        const info = document.getElementById("sumInfo");
        info.textContent = "機率總和：100.00 / 100.00%";
        info.className = "flash sum-ok";

        document.getElementById("thanksId").value = thanksItem ? thanksItem.id : "";
        document.getElementById("thanksName").value = thanksItem ? thanksItem.name : "銘謝惠顧";
        document.getElementById("thanksProb").textContent =
            thanksItem ? (thanksItem.probability / 100).toFixed(2) + "%" : "—";
    }

    async function savePrize(prizeId, tr) {
        const get = f => tr.querySelector(`[data-f="${f}"]`).value;
        const probPct = Number(get("prob"));
        if (probPct < 0.01) {
            warnIfProbTooLow(probPct);
            return;
        }
        try {
            await api("/api/admin/prizes/" + prizeId, { method: "PUT", body: JSON.stringify({
                name: get("name"),
                probability: Math.round(probPct * 100),
                totalStock: Number(get("total")),
                remainingStock: Number(get("remain"))
            }) });
            await selectActivity(selectedId);
        } catch (e) {
            alert("儲存獎品失敗：" + e.message);
        }
    }

    async function deletePrize(prizeId, prizeName) {
        if (!confirm(`確定刪除獎品「${prizeName}」？此操作不可復原。`)) return;
        try {
            await api("/api/admin/prizes/" + prizeId, { method: "DELETE" });
            await selectActivity(selectedId);
        } catch (e) {
            alert("刪除失敗：" + e.message);
        }
    }

    async function saveThanksName() {
        const id = document.getElementById("thanksId").value;
        if (!id) return;
        try {
            await api("/api/admin/prizes/" + id, { method: "PUT", body: JSON.stringify({
                name: document.getElementById("thanksName").value,
                probability: 0,
                totalStock: 0,
                remainingStock: 0
            }) });
            await selectActivity(selectedId);
        } catch (e) {
            alert("儲存失敗：" + e.message);
        }
    }

    async function addPrize() {
        const probPct = Number(document.getElementById("np_prob").value);
        if (probPct < 0.01) {
            warnIfProbTooLow(probPct);
            flash("addPrizeMsg", "機率不可低於 0.01%", false);
            return;
        }
        try {
            await api("/api/admin/activities/" + selectedId + "/prizes", { method: "POST", body: JSON.stringify({
                name: document.getElementById("np_name").value,
                type: document.getElementById("np_type").value,
                probability: Math.round(probPct * 100),
                totalStock: Number(document.getElementById("np_stock").value || 0)
            }) });
            flash("addPrizeMsg", "已新增", true);
            await selectActivity(selectedId);
        } catch (e) {
            flash("addPrizeMsg", e.message, false);
        }
    }

    function logout() {
        token = null;
        selectedId = null;
        localStorage.removeItem("lotteryToken");
        localStorage.removeItem("lotteryUser");
        document.getElementById("loginCard").style.display = "block";
        document.getElementById("console").style.display = "none";
        document.getElementById("userInfo").style.display = "none";
        document.getElementById("usernameDisplay").textContent = "";
    }

    function autoLogout() {
        logout();
    }

    document.addEventListener("DOMContentLoaded", async () => {
        const savedToken = localStorage.getItem("lotteryToken");
        const savedUser = localStorage.getItem("lotteryUser");
        if (savedToken && savedUser) {
            token = savedToken;
            showConsole(savedUser);
            try {
                await loadActivities();
            } catch (e) {
                autoLogout();
            }
        }
    });

    async function loadStats(id) {
        try {
            const s = await api("/api/admin/activities/" + id + "/stats");
            const lines = s.prizes.map(p => `${p.name}：已中 ${p.awarded} / 總 ${p.totalStock}（剩 ${p.remainingStock}）`);
            document.getElementById("statsBox").innerHTML =
                `總抽獎 ${s.totalDraws} 次、銘謝惠顧 ${s.thanksCount} 次<br>` + lines.join("<br>");
        } catch (e) { /* ignore */ }
    }
</script>
</body>
</html>
