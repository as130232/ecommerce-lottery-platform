<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>轉盤抽獎 Demo</title>
    <style>
        /* ---- Design tokens (shared with admin.html; only --accent/--header-* differ) ---- */
        :root {
            --accent: #d81f2c;
            --accent-hover: #b3122a;
            --header-bg: linear-gradient(180deg, #d81f2c 0%, #b3122a 100%);
            --bg: #eef1f5;
            --surface: #ffffff;
            --border: rgba(15,23,42,.08);
            --border-strong: rgba(15,23,42,.14);
            --radius: 14px;
            --radius-sm: 9px;
            --shadow: 0 1px 2px rgba(15,23,42,.04), 0 6px 16px rgba(15,23,42,.05);
            --shadow-hover: 0 2px 4px rgba(15,23,42,.06), 0 10px 24px rgba(15,23,42,.09);
            --text: #0f172a;
            --muted: #64748b;
            --ring: color-mix(in srgb, var(--accent) 30%, transparent);
        }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
               margin: 0; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }

        /* ---- Header (shared component) ---- */
        header { background: var(--header-bg); color: #fff; padding: 16px 24px;
                 display: flex; justify-content: space-between; align-items: center;
                 box-shadow: 0 1px 3px rgba(15,23,42,.12); }
        header .brand { display: flex; align-items: center; gap: 14px;
                        font-weight: 600; font-size: 17px; letter-spacing: -0.01em; }
        .header-link { color: #fff; font-size: 13px; font-weight: 500; text-decoration: none;
                       border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
                       padding: 5px 12px; transition: background 150ms ease; }
        .header-link:hover { background: rgba(255,255,255,.18); }
        .user-chip { display: none; align-items: center; gap: 10px;
                     background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22);
                     border-radius: 999px; padding: 4px 5px 4px 14px; }
        .user-chip .uname { font-size: 13px; font-weight: 500; color: #fff; }
        .user-chip button { border-radius: 999px; padding: 6px 15px; font-size: 13px; box-shadow: none; }
        .user-chip button:hover:not(:disabled) { transform: none; box-shadow: 0 1px 4px rgba(15,23,42,.2); }

        /* ---- Layout & cards (shared component) ---- */
        .wrap { max-width: 760px; margin: 0 auto; padding: 24px 20px; }
        .card { background: var(--surface); border: 1px solid var(--border);
                border-radius: var(--radius); padding: 22px; margin-bottom: 20px;
                box-shadow: var(--shadow); }
        h3 { margin: 0 0 14px; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
        label { font-size: 13px; color: var(--muted); }

        /* ---- Form controls (shared component) ---- */
        input, select { padding: 9px 11px; border: 1px solid var(--border-strong);
                         border-radius: var(--radius-sm); font-size: 14px; color: var(--text);
                         background: #fff; transition: border-color 150ms ease, box-shadow 150ms ease; }
        input:focus, select:focus { outline: none; border-color: var(--accent);
                                     box-shadow: 0 0 0 3px var(--ring); }

        /* ---- Buttons (shared component) ---- */
        button { background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm);
                 padding: 10px 18px; cursor: pointer; font-size: 14px; font-weight: 500;
                 transition: transform 150ms ease, box-shadow 150ms ease, background 150ms ease; }
        button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--shadow-hover);
                                       background: var(--accent-hover); }
        button:active:not(:disabled) { transform: translateY(0); box-shadow: none; }
        button:disabled { background: #cbd5e1; cursor: not-allowed; }
        button.ghost { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
        button.ghost:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 8%, #fff);
                                            color: var(--accent); }

        /* ---- Login form (shared component, identical on both pages) ---- */
        .login-card { max-width: 380px; margin: 40px auto; }
        .login-form { display: flex; flex-direction: column; gap: 14px; }
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field input { width: 100%; margin: 0; }
        .login-form button { width: 100%; margin-top: 2px; }
        .login-form .muted, .login-form .flash { text-align: center; margin-left: 0; }

        /* ---- Utilities (shared) ---- */
        .muted { color: var(--muted); font-size: 13px; }
        .tnum { font-variant-numeric: tabular-nums; }
        .msg-error { color: #dc2626; font-weight: 600; }
        .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

        /* ---- Page-specific: lottery wheel ---- */
        .wheel-box { position: relative; width: 320px; height: 320px; margin: 14px auto; }
        .pointer { position: absolute; top: -4px; left: 50%; transform: translateX(-50%);
                   width: 0; height: 0; border-left: 13px solid transparent;
                   border-right: 13px solid transparent; border-top: 26px solid var(--accent); z-index: 3;
                   filter: drop-shadow(0 2px 3px rgba(15,23,42,.35)); }
        canvas { border-radius: 50%; box-shadow: 0 6px 22px rgba(15,23,42,.20);
                 transition: transform 4s cubic-bezier(.15,.85,.25,1); }
        .result { text-align: center; font-size: 18px; margin-top: 12px; min-height: 26px; font-weight: 600; }
        ul { padding-left: 18px; } li { margin: 4px 0; font-size: 14px; }
    </style>
</head>
<body>
<header>
    <div class="brand">
        <span>🎡 電商轉盤抽獎 Demo</span>
        <a href="/admin.html" class="header-link">後台設定 →</a>
    </div>
    <div id="userInfo" class="user-chip">
        <span id="usernameDisplay" class="uname"></span>
        <button class="ghost" onclick="logout()">登出</button>
    </div>
</header>
<div class="wrap">
    <div class="card login-card" id="loginCard">
        <h3>會員登入</h3>
        <div class="login-form">
            <div class="field"><label>帳號</label><input id="username" value="alice"/></div>
            <div class="field"><label>密碼</label><input id="password" type="password" value="alice123"/></div>
            <button onclick="login()">登入</button>
            <span class="muted" id="loginMsg"></span>
        </div>
        <p class="muted" style="margin:14px 0 0; text-align:center">預設帳號：alice / alice123（一般使用者），admin / admin123（管理員）</p>
    </div>

    <div class="card" id="gameCard" style="display:none">
        <div class="row" style="justify-content:space-between; align-items:center">
            <h3 id="activityName" style="margin:0">活動載入中…</h3>
            <select id="activitySelect" onchange="switchActivity()"></select>
        </div>
        <div class="wheel-box">
            <div class="pointer"></div>
            <canvas id="wheel" width="320" height="320"></canvas>
        </div>
        <div class="row" style="justify-content:center">
            <button id="spin1" onclick="draw(1)">抽一次</button>
            <button id="spin5" class="ghost" onclick="draw(5)">連抽 5 次</button>
        </div>
        <div class="muted tnum" id="quota" style="text-align:center;margin-top:8px"></div>
        <div class="result" id="result"></div>
    </div>

    <div class="card" id="recordCard" style="display:none">
        <div class="row" style="justify-content:space-between">
            <h3 style="margin:0">我的抽獎紀錄</h3>
            <button class="ghost" onclick="loadRecords()">重新整理</button>
        </div>
        <ul id="records"></ul>
    </div>
</div>

<script>
    let activityId = null;
    let token = null;
    let prizes = [];
    let currentAngle = 0;
    // refined, tonally-harmonised jewel palette (similar saturation/lightness)
    const colors = ["#e14b5a", "#eaa23b", "#2fa4a0", "#5b6ee0", "#a45bd0", "#3bb273", "#e2734a"];

    async function api(path, options = {}) {
        options.headers = Object.assign({ "Content-Type": "application/json" }, options.headers || {});
        if (token) options.headers["Authorization"] = "Bearer " + token;
        const res = await fetch(path, options);
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
            if (res.status === 401 && path !== "/api/auth/login") autoLogout();
            throw new Error(body.message || ("HTTP " + res.status));
        }
        return body.data;
    }

    async function login() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        try {
            const data = await api("/api/auth/login", { method: "POST",
                body: JSON.stringify({ username, password }) });
            token = data.accessToken;
            localStorage.setItem("lotteryToken", token);
            localStorage.setItem("lotteryUser", username);
            showConsole(username);
            await loadActivities();
        } catch (e) {
            const el = document.getElementById("loginMsg");
            el.textContent = "登入失敗：" + e.message;
            el.className = "muted msg-error";
        }
    }

    function showConsole(username) {
        document.getElementById("loginCard").style.display = "none";
        document.getElementById("usernameDisplay").textContent = username;
        document.getElementById("userInfo").style.display = "flex";
        document.getElementById("gameCard").style.display = "block";
        document.getElementById("recordCard").style.display = "block";
    }

    // populate the activity dropdown with the currently ACTIVE activities
    async function loadActivities() {
        const list = await api("/api/activities");
        const sel = document.getElementById("activitySelect");
        sel.innerHTML = "";
        list.forEach(a => {
            const opt = document.createElement("option");
            opt.value = a.id;
            opt.textContent = a.name;
            sel.appendChild(opt);
        });
        if (list.length) {
            activityId = list[0].id;
            await refresh();
        } else {
            document.getElementById("activityName").textContent = "目前沒有進行中的活動";
        }
    }

    async function switchActivity() {
        activityId = Number(document.getElementById("activitySelect").value);
        document.getElementById("result").textContent = "";
        await refresh();
    }

    async function refresh() {
        await loadActivity();
        await loadRecords();
        await loadQuota();
    }

    async function loadQuota() {
        try {
            const q = await api("/api/activities/" + activityId + "/my-quota");
            document.getElementById("quota").textContent =
                "剩餘可抽次數：" + q.remaining + " / " + q.perUserDrawLimit + "（已抽 " + q.used + " 次）";
        } catch (e) { /* ignore */ }
    }

    async function loadActivity() {
        const detail = await api("/api/activities/" + activityId);
        document.getElementById("activityName").textContent = detail.name;
        prizes = detail.prizes;
        drawWheel();
    }

    // blend a hex colour toward white (pct>0) or black (pct<0), pct in [-1,1]
    function shade(hex, pct) {
        const num = parseInt(hex.slice(1), 16);
        const t = pct < 0 ? 0 : 255, p = Math.abs(pct);
        const r = Math.round(((num >> 16) & 255) * (1 - p) + t * p);
        const g = Math.round(((num >> 8) & 255) * (1 - p) + t * p);
        const b = Math.round((num & 255) * (1 - p) + t * p);
        return `rgb(${r},${g},${b})`;
    }

    function drawWheel() {
        const canvas = document.getElementById("wheel");
        const size = 320, dpr = window.devicePixelRatio || 1;
        // render at device resolution for crisp edges & text, keep 320px CSS box
        canvas.width = size * dpr;
        canvas.height = size * dpr;
        canvas.style.width = size + "px";
        canvas.style.height = size + "px";
        const ctx = canvas.getContext("2d");
        ctx.scale(dpr, dpr);

        const cx = 160, cy = 160;
        const rimInner = 140, rimOuter = 158, hubR = 34;
        const n = prizes.length || 1;
        const slice = (2 * Math.PI) / n;   // slices start at 0 (3 o'clock); spinTo math depends on this
        ctx.clearRect(0, 0, size, size);

        // 1) wedges with a centre→edge radial gradient for depth
        prizes.forEach((p, i) => {
            const base = colors[i % colors.length];
            const g = ctx.createRadialGradient(cx, cy, hubR, cx, cy, rimInner);
            g.addColorStop(0, shade(base, 0.10));
            g.addColorStop(1, shade(base, -0.16));
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, rimInner, i * slice, (i + 1) * slice);
            ctx.closePath();
            ctx.fillStyle = g;
            ctx.fill();
        });

        // 2) thin separators between wedges
        ctx.strokeStyle = "rgba(255,255,255,.30)";
        ctx.lineWidth = 1.5;
        for (let i = 0; i < n; i++) {
            const a = i * slice;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + rimInner * Math.cos(a), cy + rimInner * Math.sin(a));
            ctx.stroke();
        }

        // 3) prize labels (with a soft shadow for legibility)
        prizes.forEach((p, i) => {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(i * slice + slice / 2);
            ctx.textAlign = "right";
            ctx.font = "600 13px -apple-system, 'PingFang TC', sans-serif";
            ctx.shadowColor = "rgba(0,0,0,.35)";
            ctx.shadowBlur = 3;
            ctx.shadowOffsetY = 1;
            ctx.fillStyle = "#fff";
            ctx.fillText(p.name.substring(0, 8), rimInner - 14, 5);
            ctx.restore();
        });

        // 4) deep slate outer rim band (subtle metallic sheen)
        const rimGrad = ctx.createLinearGradient(0, cy - rimOuter, 0, cy + rimOuter);
        rimGrad.addColorStop(0, "#3a506b");
        rimGrad.addColorStop(0.5, "#24354a");
        rimGrad.addColorStop(1, "#16202e");
        ctx.beginPath();
        ctx.arc(cx, cy, (rimInner + rimOuter) / 2, 0, 2 * Math.PI);
        ctx.lineWidth = rimOuter - rimInner;
        ctx.strokeStyle = rimGrad;
        ctx.stroke();
        // crisp hairline on the very edge
        ctx.beginPath();
        ctx.arc(cx, cy, rimOuter, 0, 2 * Math.PI);
        ctx.lineWidth = 1;
        ctx.strokeStyle = "rgba(15,23,42,.15)";
        ctx.stroke();

        // 5) evenly-spaced light dots on the rim
        const dotR = (rimInner + rimOuter) / 2;
        for (let i = 0; i < n; i++) {
            const a = i * slice;
            ctx.beginPath();
            ctx.arc(cx + dotR * Math.cos(a), cy + dotR * Math.sin(a), 2.5, 0, 2 * Math.PI);
            ctx.fillStyle = "rgba(255,255,255,.85)";
            ctx.fill();
        }

        // 6) centre hub: white disc + crimson ring + centre dot
        ctx.shadowColor = "rgba(15,23,42,.28)";
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 2;
        const hubGrad = ctx.createRadialGradient(cx - 9, cy - 9, 4, cx, cy, hubR);
        hubGrad.addColorStop(0, "#ffffff");
        hubGrad.addColorStop(1, "#e9edf3");
        ctx.beginPath();
        ctx.arc(cx, cy, hubR, 0, 2 * Math.PI);
        ctx.fillStyle = hubGrad;
        ctx.fill();
        ctx.shadowColor = "transparent";
        ctx.beginPath();
        ctx.arc(cx, cy, hubR - 1, 0, 2 * Math.PI);
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#d81f2c";
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(cx, cy, 9, 0, 2 * Math.PI);
        ctx.fillStyle = "#d81f2c";
        ctx.fill();
    }

    function segmentIndexOf(prizeId) {
        const idx = prizes.findIndex(p => p.id === prizeId);
        return idx < 0 ? 0 : idx;
    }

    async function draw(times) {
        setButtons(true);
        document.getElementById("result").textContent = "抽獎中…";
        try {
            // idempotencyKey left blank -> backend generates one per request
            const result = await api("/api/activities/" + activityId + "/draws",
                { method: "POST", body: JSON.stringify({ times }) });
            // spin the wheel to the first outcome for a bit of flair
            const first = result.outcomes[0];
            spinTo(segmentIndexOf(first.prizeId), () => showResult(result.outcomes));
        } catch (e) {
            document.getElementById("result").textContent = "失敗：" + e.message;
            setButtons(false);
        }
    }

    function spinTo(index, done) {
        const slice = 360 / prizes.length;
        const center = index * slice + slice / 2;
        // pointer sits at the top (canvas 270°, since y grows downward); rotate so the
        // winning slice's centre ends up right under it, after a few full spins.
        const base = ((270 - center) % 360 + 360) % 360;
        const target = 360 * 5 + base;
        currentAngle = target;
        const canvas = document.getElementById("wheel");
        canvas.style.transform = "rotate(" + currentAngle + "deg)";
        setTimeout(() => {
            // normalise so repeated spins don't accumulate huge numbers
            currentAngle = currentAngle % 360;
            canvas.style.transition = "none";
            canvas.style.transform = "rotate(" + currentAngle + "deg)";
            void canvas.offsetWidth; // reflow
            canvas.style.transition = "";
            done();
            setButtons(false);
            loadRecords();
            loadQuota();
        }, 4100);
    }

    function showResult(outcomes) {
        const wins = outcomes.filter(o => o.result === "WIN");
        if (outcomes.length === 1) {
            const o = outcomes[0];
            document.getElementById("result").textContent =
                o.result === "WIN" ? ("🎉 恭喜中獎：" + o.prizeName) : "銘謝惠顧，再接再厲！";
        } else {
            document.getElementById("result").textContent =
                "連抽 " + outcomes.length + " 次，中獎 " + wins.length + " 個" +
                (wins.length ? "：" + wins.map(w => w.prizeName).join("、") : "");
        }
    }

    async function loadRecords() {
        try {
            const records = await api("/api/activities/" + activityId + "/my-records");
            const ul = document.getElementById("records");
            ul.innerHTML = "";
            records.slice(0, 15).forEach(r => {
                const li = document.createElement("li");
                const tag = r.result === "WIN" ? "🎁 " + r.prizeName : "銘謝惠顧";
                li.textContent = r.createdAt.replace("T", " ") + "  ·  " + tag;
                ul.appendChild(li);
            });
        } catch (e) { /* ignore on the records panel */ }
    }

    function setButtons(disabled) {
        document.getElementById("spin1").disabled = disabled;
        document.getElementById("spin5").disabled = disabled;
    }

    function logout() {
        token = null;
        localStorage.removeItem("lotteryToken");
        localStorage.removeItem("lotteryUser");
        document.getElementById("loginCard").style.display = "block";
        document.getElementById("gameCard").style.display = "none";
        document.getElementById("recordCard").style.display = "none";
        document.getElementById("userInfo").style.display = "none";
        document.getElementById("usernameDisplay").textContent = "";
        document.getElementById("loginMsg").textContent = "";
    }

    function autoLogout() {
        logout();
    }

    document.addEventListener("DOMContentLoaded", async () => {
        const savedToken = localStorage.getItem("lotteryToken");
        const savedUser = localStorage.getItem("lotteryUser");
        if (savedToken && savedUser) {
            token = savedToken;
            showConsole(savedUser);
            try {
                await loadActivities();
            } catch (e) {
                autoLogout();
            }
        }
    });
</script>
</body>
</html>
