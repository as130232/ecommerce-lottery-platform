services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: lottery
      MYSQL_USER: lottery
      MYSQL_PASSWORD: lottery
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # everything is env-driven so the same image runs in any environment
      DB_URL: jdbc:mysql://mysql:3306/lottery?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: lottery
      DB_PASSWORD: lottery
      DB_POOL_SIZE: "30"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: please-change-this-in-production-a-long-random-32byte-secret
      APP_LOG_LEVEL: INFO
    ports:
      - "8080:8080"
